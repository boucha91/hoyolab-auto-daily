name: Latest version

on:
  schedule:
    - cron: "23 18 * * *" # avoid the top of the hour
  workflow_dispatch:

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Clone Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch package.json from original repo
        run: |
          curl --fail --silent --show-error --location \
               --output remote-package.json \
               https://raw.githubusercontent.com/sglkc/hoyolab-auto-daily/master/package.json

      - name: Compare versions
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          LOCAL_VERSION=$(jq -r .version package.json)
          REMOTE_VERSION=$(jq -r .version remote-package.json)
          echo "Local version: $LOCAL_VERSION"
          echo "Remote version: $REMOTE_VERSION"

          if [ "$(printf '%s\n' "$REMOTE_VERSION" "$LOCAL_VERSION" | sort -V | head -n1)" != "$REMOTE_VERSION" ]; then
            echo "Repository version is outdated. Do sync your fork!"

            if [ -n "$DISCORD_WEBHOOK" ]; then
              curl --fail --silent --show-error \
                   --url "$DISCORD_WEBHOOK" \
                   -H "Content-Type: application/json" \
                   --data-binary '{"content": "(INFO) New version released. Your repository is outdated."}'
            fi

            exit 1
          fi
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
